<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration - ELITE FF</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h2>Join Tournament</h2>
    <div class="card">
        <form id="regForm">
            <input type="text" id="squad" placeholder="Squad Name" required>
            <input type="text" id="leader" placeholder="Leader In-game Name" required>
            <input type="number" id="phone" placeholder="WhatsApp Number" required>
            <textarea id="players" placeholder="List Player UIDs (e.g. 12345, 67890...)" required></textarea>
            <div class="payment-box">
                <p>Send Fee to: <b id="payNum">Loading...</b></p>
                <input type="text" id="trx" placeholder="Transaction ID (TrxID)" required>
            </div>
            <button type="submit" class="btn">Submit Registration</button>
        </form>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAae7Vx8aONupJBC6_Lg9oqLnuXSA-KUoQ",
            authDomain: "eliteffbd.firebaseapp.com",
            projectId: "eliteffbd",
            storageBucket: "eliteffbd.firebasestorage.app",
            messagingSenderId: "891855320405",
            appId: "1:891855320405:web:c7191ce7a6eb59f5e76bdc"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        onSnapshot(doc(db, "tournament", "settings"), (doc) => {
            if (doc.exists()) document.getElementById('payNum').innerText = doc.data().paymentNumber || "N/A";
        });

        document.getElementById('regForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                await addDoc(collection(db, "registrations"), {
                    squad: document.getElementById('squad').value,
                    leader: document.getElementById('leader').value,
                    phone: document.getElementById('phone').value,
                    players: document.getElementById('players').value,
                    trx: document.getElementById('trx').value,
                    status: "pending",
                    timestamp: new Date()
                });
                alert("Registration successful! Wait for admin verification.");
                window.location.href = "/";
            } catch (err) {
                alert("Error: " + err.message);
            }
        });
    </script>
</body>
</html>
