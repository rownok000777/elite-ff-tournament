<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELITE FF TOURNAMENT BD</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>ELITE FF TOURNAMENT BD</h1>
        <div class="card"><p id="notice">Connecting...</p></div>
    </header>

    <main>
        <div class="card">
            <h2>Tournament Info</h2>
            <p>Prize Pool: <span id="totalPrize">0</span></p>
            <p>Entry Fee: <span id="entryFee">0</span></p>
            <hr>
            <p>1st: <span id="p1">0</span> | 2nd: <span id="p2">0</span> | 3rd: <span id="p3">0</span></p>
        </div>
        <button onclick="location.href='/register'" class="btn">Register Now</button>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAae7Vx8aONupJBC6_Lg9oqLnuXSA-KUoQ",
            authDomain: "eliteffbd.firebaseapp.com",
            projectId: "eliteffbd",
            storageBucket: "eliteffbd.firebasestorage.app",
            messagingSenderId: "891855320405",
            appId: "1:891855320405:web:c7191ce7a6eb59f5e76bdc"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        onSnapshot(doc(db, "tournament", "settings"), (doc) => {
            if (doc.exists()) {
                const data = doc.data();
                document.getElementById('notice').innerText = data.notice;
                document.getElementById('totalPrize').innerText = data.totalPrize;
                document.getElementById('entryFee').innerText = data.entryFee;
                document.getElementById('p1').innerText = data.p1;
                document.getElementById('p2').innerText = data.p2;
                document.getElementById('p3').innerText = data.p3;
            }
        });
    </script>
</body>
</html>
